<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Party 🌹☁️✨ 妖精 #3 登場準備編</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;overflow:hidden;font-family:'M PLUS Rounded 1c',sans-serif;
       background:linear-gradient(135deg,#fff0c4 0%,#ffdde1 50%,#d7e9fc 100%);color:#4a3b32;user-select:none}
  #topbar,#bottombar{position:fixed;left:0;right:0;z-index:100;background:rgba(255,255,255,.7);
       backdrop-filter:blur(10px);display:flex;align-items:center}
  #topbar{top:0;padding:10px 14px;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.5)}
  #bottombar{bottom:0;padding:14px;justify-content:center;gap:8px;border-top:1px solid rgba(255,255,255,.5)}
  #topbar h1{margin:0;font-size:14px;font-weight:700;color:#ff9800}
  #topbar h1 small{display:block;font-size:10px;color:#777;font-weight:500}
  .nav-btn{background:#ff4081;color:#fff;border:none;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;
           box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .15s;text-decoration:none;display:inline-block}
  .nav-btn:hover{transform:translateY(-2px);background:#e91e63}
  .nav-btn:active{transform:scale(.96)}
  .nav-btn:disabled{opacity:.45;cursor:not-allowed}
  .ghost-btn{background:rgba(255,255,255,.6);color:#555;border:1px solid #ccc;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:700;cursor:pointer}
  #stage{position:fixed;inset:50px 0 110px 0;overflow:hidden}

  .fairy-card{position:absolute;left:var(--pos-x);top:var(--pos-y);
              transform:translate(-50%,-50%) scale(var(--scale));text-align:center;cursor:pointer}
  .fairy-img{width:260px;height:auto;max-height:220px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.18));pointer-events:none}
  .fairy-img-fallback{font-size:110px;line-height:1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.2));pointer-events:none}
  .fairy-card.jumping .fairy-img,.fairy-card.jumping .fairy-img-fallback{animation:jumpBounce .5s ease}
  .fairy-name{margin-top:6px;background:rgba(255,255,255,.88);padding:8px 14px;border-radius:16px;
              display:inline-block;border:2px solid var(--fairy-color);box-shadow:0 2px 6px rgba(0,0,0,.1);font-size:13px}
  .fairy-name strong{font-size:14px;color:var(--fairy-accent);display:block}
  .fairy-name .role{font-size:11px;color:var(--fairy-accent)}
  .fairy-name .caption{display:block;font-size:10px;color:#888;margin-top:2px}

  .fairy-placeholder{width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--fairy-color) 30%,#fff) 0%,transparent 70%);
    border:3px dashed var(--fairy-color);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--fairy-accent);animation:pulse 2s ease-in-out infinite}
  .fairy-placeholder .ph-icon{font-size:50px}
  .fairy-placeholder .ph-name{font-weight:700;font-size:13px;margin-top:4px}
  .fairy-placeholder .ph-hint{font-size:9px;color:#777;margin-top:4px}
  .fairy-placeholder .ph-hint code{background:#fff5;padding:1px 4px;border-radius:3px}

  @keyframes fadeBounce   { 0%{transform:translate(-50%,-50%) scale(0.4);}
                            60%{transform:translate(-50%,-50%) scale(1.15);}
                            80%{transform:translate(-50%,-50%) scale(0.95);}
                            100%{transform:translate(-50%,-50%) scale(1.0);} }
  @keyframes floatDown    { 0%{transform:translate(-50%,-160%) scale(0.6);}
                            70%{transform:translate(-50%,-45%) scale(1.1);}
                            100%{transform:translate(-50%,-50%) scale(1.0);} }
  @keyframes sparkleBurst { 0%{transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}
                            60%{transform:translate(-50%,-50%) scale(1.2) rotate(180deg);}
                            100%{transform:translate(-50%,-50%) scale(1.0) rotate(360deg);} }
  @keyframes windSweep    { 0%{transform:translate(-160%,-50%) scale(0.6);}
                            70%{transform:translate(-45%,-50%) scale(1.1);}
                            100%{transform:translate(-50%,-50%) scale(1.0);} }
  .entry-fadeBounce   {animation:fadeBounce   1100ms cubic-bezier(.34,1.56,.64,1) forwards}
  .entry-floatDown    {animation:floatDown    1500ms cubic-bezier(.34,1.56,.64,1) forwards}
  .entry-sparkleBurst {animation:sparkleBurst 1300ms ease-out forwards}
  .entry-windSweep    {animation:windSweep    1300ms cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes pulse      { 0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--fairy-color) 40%,transparent);}
                                     50%{box-shadow:0 0 0 14px transparent;} }
  @keyframes jumpBounce { 0%{transform:translateY(0)} 30%{transform:translateY(-30px) rotate(-3deg)}
                          60%{transform:translateY(0) rotate(0)} 80%{transform:translateY(-10px) rotate(2deg)}
                          100%{transform:translateY(0) rotate(0)} }

  .fairy-bubble{position:absolute;bottom:96%;left:50%;transform:translateX(-50%) scale(.85);
                background:#fff;color:#4a3b32;border:2px solid var(--fairy-color);
                padding:10px 16px;border-radius:18px;font-size:14px;font-weight:600;
                max-width:320px;min-width:180px;line-height:1.4;
                box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;
                transition:opacity .3s ease,transform .3s ease;
                pointer-events:none;z-index:50;text-align:left}
  .fairy-bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
  .fairy-bubble .b-name{display:block;background:var(--fairy-color);color:#fff;padding:2px 8px;border-radius:10px;
                        font-size:11px;font-weight:700;margin-bottom:4px;width:fit-content}
  .fairy-bubble .b-text{display:block;font-size:14px}
  .fairy-bubble::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
                       border:8px solid transparent;border-top-color:var(--fairy-color)}
</style>
</head>
<body>

<nav id="topbar">
  <h1>🌹☁️✨ 妖精 #3 登場準備編
    <small>data-driven sequencer · 3/4</small></h1>
  <a class="nav-btn" href="webar_fairy_world.html">🌐 ハブへ戻る</a>
</nav>

<div id="stage"></div>

<nav id="bottombar">
  <button class="ghost-btn" onclick="location.href='index2.html'">◀ まえへ</button>
  <button class="nav-btn" id="next-btn" disabled onclick="location.href='index4.html'">つぎの妖精へ ➔</button>
</nav>

<script src="fairies.js"></script>
<script>
  const stage = document.getElementById('stage');
  FairySequencer.buildNodes(stage, { onlyIds:['rose','ria','fairy3'] });
  FairySequencer.runSequence(stage, { onlyIds:['rose','ria','fairy3'] });
  setTimeout(()=>{ document.getElementById('next-btn').disabled = false; }, 5800);
</script>

</body>
</html>
