  var lineup = document.getElementById('lineup');
  lineup.src = 'data:image/png;base64,' + LINEUP_B64;
  function fire(x,y,opts){
    opts=opts||{};
    var isGlyph = Math.random()<0.7;
    var el = document.createElement('div');
    if(isGlyph){
      el.className = 'spark glyph';
      var g=["\\u2726","\\u2727","\\u2605","\\u25C6","\\u273F","\\u2740"];
      el.textContent = String.fromCharCode(g[Math.floor(Math.random()*g.length)]);
      var p=["#ffd54f","#ff80ab","#81d4fa","#fff","#c5e1a5","#ce93d8","#fff59d"];
      el.style.color = p[Math.floor(Math.random()*p.length)];
    } else {
      el.className = 'spark';
      var s = 4 + Math.random()*4;
      el.style.width = el.style.height = s+'px';
    }
    el.style.left = (x - el.offsetWidth/2)+'px';
    el.style.top  = (y - el.offsetHeight/2)+'px';
    var ang = Math.random()*Math.PI*2;
    var dist = 80 + Math.random()*220;
    el.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
    el.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
    el.style.animationDuration = (isGlyph?(900+Math.random()*800):(1500+Math.random()*1200))+'ms';
    el.addEventListener('animationend', function(){ el.remove(); }, {once:true});
    document.getElementById('stage').appendChild(el);
  }
  function burst(x,y,n,o){
    o = o||{};
    for(var i=0;i<n;i++) setTimeout(function(){ fire(x,y,o); }, Math.random()*(o.stagger||60));
