<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Party - バラの妖精ローズ (HIROマーカー版)</title>
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <img id="rose1" src="rose_1.png">
        <img id="rose2" src="rose_2.png">
        <img id="rose3" src="rose_3.png">
        <img id="rose4" src="rose_4.png">
        <img id="rose5" src="rose_5.png">
        <img id="rose6" src="rose_6.png">
        <img id="rose7" src="rose_7.png">
      </a-assets>

      <!-- HIROマーカーを読み取る設定 -->
      <a-marker preset="hiro">
        <!-- 横幅をさらに広げ、縦を少し縮めてふっくら感をアップ -->
        <a-image 
          id="rose-fairy"
          src="#rose1" 
          position="0 0.8 0" 
          rotation="-90 0 0"
          width="2.5" 
          height="1.35"
          class="clickable"
          animation__float="property: position; to: 0 1.0 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine">
        </a-image>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const rose = document.querySelector('#rose-fairy');
          if (!rose) return;
          let isJumping = false;

          // 1. 瞬きアニメーション (rose_1 ⇄ rose_2)
          setInterval(() => {
            if (!isJumping) {
              rose.setAttribute('src', '#rose2');
              setTimeout(() => {
                if (!isJumping) rose.setAttribute('src', '#rose1');
              }, 150);
            }
          }, 3000);

          // 2. タップ時ジャンプアニメーション (連番画像でパラパラマンガ)
          const jumpFrames = ['#rose1', '#rose3', '#rose4', '#rose5', '#rose6', '#rose7', '#rose1'];

          rose.addEventListener('click', () => {
            if (isJumping) return;
            isJumping = true;

            let frameIndex = 0;
            const frameInterval = 120; // コマ送り速度

            const jumpTimer = setInterval(() => {
              frameIndex++;
              if (frameIndex < jumpFrames.length) {
                rose.setAttribute('src', jumpFrames[frameIndex]);
              } else {
                clearInterval(jumpTimer);
                rose.setAttribute('src', '#rose1');
                isJumping = false;
              }
            }, frameInterval);
          });
        }, 1000);
      });
    </script>
  </body>
</html>
