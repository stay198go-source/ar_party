<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<script>
/* 何かうまくいかないとき、画面の下に理由を出す（スクリーンショットを送ってもらうための目印） */
(function(){
  function show(m){ try{
    var b = document.getElementById('__err');
    if(!b){ b = document.createElement('div'); b.id = '__err';
      b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;background:rgba(160,20,20,.95);color:#fff;font:12px/1.5 monospace;padding:8px 10px;border-radius:10px;max-height:34vh;overflow:auto;white-space:pre-wrap;word-break:break-all';
      b.onclick = function(){ b.parentNode && b.parentNode.removeChild(b); };
      (document.body || document.documentElement).appendChild(b); b.textContent = '⚠️ うまく動かないところがあるよ（タップでとじる）'; }
    if(b.textContent.length < 900) b.textContent += '\n' + m;
  }catch(x){} }
  window.addEventListener('error', function(e){
    var t = e.target;
    if(t && t !== window && t.tagName){            // ファイルが読みこめなかった
      if(t.tagName === 'SCRIPT') show('読みこめない: ' + (t.src || '').split('/').slice(-1)[0]);
      else if(t.tagName === 'LINK' && /hub\.css/.test(t.href || '')) show('読みこめない: hub.css');
      return;
    }
    show((e.message || 'エラー') + '  [' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?') + ']');
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason, m = String((r && (r.message || r.name)) || r);
    if(/NotAllowed|Abort|play\(\)|decode|interrupt/i.test(m)) return;     // 音まわりの、こまかい失敗は出さない
    show('Promise: ' + m);
  });
})();
</script>
<title>AR Party 🌹 ローズ登場</title>
<style>
  /* カメラが使えなくても、まっ黒にならないように、背景はピンクにしておく */
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:linear-gradient(160deg,#ffe3ec 0%,#f7b6cf 55%,#c9b6ff 100%);
    font-family:"Hiragino Maru Gothic Pro","M PLUS Rounded 1c",sans-serif; color:#fff;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }

  /* カメラ映像（うしろ）。うつった時だけ表示する */
  #cam { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; display:none; background:#000; }
  #cam.on { display:block; }

  .top-bar { position:fixed; top:env(safe-area-inset-top,0); left:0; right:0; padding:14px 18px; z-index:30; display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0)); pointer-events:none; }
  .top-bar .title { font-weight:700; font-size:15px; text-shadow:0 1px 4px rgba(0,0,0,.6); }
  .top-bar .title small { font-weight:500; opacity:.9; font-size:11px; display:block; }

  .bottom-bar { position:fixed; left:0; right:0; bottom:env(safe-area-inset-bottom,0); padding:14px 16px 24px; z-index:30;
    display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; pointer-events:none;
    background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0)); }
  .hint { background:rgba(0,0,0,.5); border-radius:14px; padding:8px 14px; font-size:13px; text-align:center; }
  .home-btn { display:none; align-items:center; gap:8px; background:linear-gradient(135deg,#ff8fbb,#ff4081); color:#fff; text-decoration:none;
    border:none; border-radius:999px; padding:12px 18px; font-size:14px; font-weight:700; box-shadow:0 6px 20px rgba(255,64,129,.45); cursor:pointer; pointer-events:auto; }
  .home-btn.show { display:inline-flex; animation:bounceIn .6s both; }
  .home-btn.sub { background:rgba(255,255,255,.92); color:#c2185b; box-shadow:0 4px 14px rgba(0,0,0,.25); }
  @keyframes bounceIn { 0% { transform:scale(.6); opacity:0; } 60%{ transform:scale(1.08); opacity:1; } 100%{ transform:scale(1); } }

  .bubble { position:fixed; left:50%; bottom:calc(110px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    max-width:80vw; background:#fff; color:#5a0a2c; border-radius:18px; padding:10px 16px;
    font-size:14px; font-weight:600; line-height:1.45; box-shadow:0 6px 22px rgba(0,0,0,.35);
    border:2px solid #ff4081; opacity:0; pointer-events:none; transition:opacity .35s,transform .35s; z-index:40; text-align:center; }
  .bubble.show { opacity:1; transform:translateX(-50%) translateY(-4px); }

  .note { position:fixed; left:50%; top:calc(70px + env(safe-area-inset-top,0px)); transform:translateX(-50%); z-index:45; max-width:76vw; text-align:center;
    background:rgba(0,0,0,.6); color:#fff; font-size:12px; line-height:1.5; padding:8px 14px; border-radius:14px; opacity:0; pointer-events:none; transition:opacity .35s; }
  .note.show { opacity:1; }

  .start-veil { position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; flex-direction:column;
    background:linear-gradient(135deg,#ffdde1,#ee9ca7); color:#5a0a2c; gap:18px; transition:opacity .4s; padding:24px; }
  .start-veil.hide { opacity:0; pointer-events:none; }
  .start-veil .big { font-size:64px; line-height:1; animation:bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{ transform:translateY(0) rotate(-3deg); } 50%{ transform:translateY(-10px) rotate(3deg); } }
  .start-veil h1 { font-size:22px; margin:0; text-shadow:0 2px 6px rgba(255,255,255,.6); }
  .start-veil p { font-size:13px; margin:0; max-width:80vw; text-align:center; line-height:1.7; }
  .start-veil button { background:linear-gradient(135deg,#ff8fbb,#ff4081); color:#fff; border:none; border-radius:999px;
    padding:15px 32px; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 6px 20px rgba(255,64,129,.45); font-family:inherit; }

  /* ---------- ローズ本体 ---------- */
  .rose-box { position:fixed; left:0; top:0; z-index:28; opacity:0; pointer-events:none;
    transform-origin:50% 88%; will-change:transform,opacity; transition:opacity .25s; }
  .rose-box.on { opacity:1; }
  .rose-float { width:100%; height:100%; animation:roseFloat 4.4s ease-in-out infinite; will-change:transform; }
  .rose-box img { display:block; width:100%; height:100%; object-fit:contain; pointer-events:none; -webkit-user-drag:none;
    filter:drop-shadow(0 14px 18px rgba(0,0,0,.3)); }
  @keyframes roseFloat {
    0%   { transform:translate(0,0) rotate(-1.6deg); }
    25%  { transform:translate(7px,-12px) rotate(0deg); }
    50%  { transform:translate(0,-20px) rotate(1.6deg); }
    75%  { transform:translate(-7px,-10px) rotate(0deg); }
    100% { transform:translate(0,0) rotate(-1.6deg); }
  }
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>

<div class="start-veil" id="startVeil">
  <div class="big">🌹</div>
  <h1>AR Party</h1>
  <p>ローズが、あなたに会いにきたよ！<br/>「ローズに会う」をタップしてね ✨<br/><span style="font-size:11px;opacity:.8">📷 カメラがひらきます　🔊 音が出るよ（マナーモードだと、鳴らないことがあるよ）</span></p>
  <button id="startBtn">🌹 ローズに会う</button>
</div>

<div class="top-bar">
  <div class="title">🌹 ローズ登場<small>AR Party</small></div>
</div>

<div class="note" id="note"></div>
<div class="rose-box" id="roseBox"><div class="rose-float"><img id="roseImg" src="rose_1.webp" alt="ローズ" draggable="false" /></div></div>

<div class="bubble" id="bubble"></div>

<div class="bottom-bar">
  <div class="hint" id="hint">🌹 ローズをさがしているよ…</div>
  <a class="home-btn" id="zukanBtn" href="zukan.html?new=rose">📖 ずかんにとうろく</a>
  <a class="home-btn sub" id="homeBtn" href="webar_fairy_world.html?new=rose">🏠 ホームへ戻る</a>
</div>

<script src="fairies.js?v=13"></script>
<script>
if(window.FAIRY_VERSION !== '13'){
  (function(){ var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99998;background:#d32f2f;color:#fff;padding:10px 14px;font:700 13px/1.5 sans-serif;text-align:center';
    d.textContent = '⚠️ ファイルの新しさがそろっていません。ページを閉じて開き直してね。それでもだめなら、GitHubに ar_party のファイルを全部入れ直してね。';
    function add(){ document.body.appendChild(d); } if(document.body) add(); else document.addEventListener('DOMContentLoaded', add); })();
}
</script>
<script>
(function(){

  const $ = id => document.getElementById(id);
  const cam = $('cam'), box = $('roseBox'), img = $('roseImg'), bubble = $('bubble'), hint = $('hint'), note = $('note');
  const startVeil = $('startVeil'), startBtn = $('startBtn'), homeBtn = $('homeBtn'), zukanBtn = $('zukanBtn');

  const ROSE = FAIRIES.find(f => f.id === 'rose');
  const META = ROSE.img;
  const fx   = FairyFX.createLayer(document.body, true);
  if(window.FairySound && FairySound.preloadVoice) FairySound.preloadVoice('voice_rose_hello');   // 声のファイルを、先に読みこんでおく
  const snd = (name, a, b, c) => { try{ if(window.FairySound && FairySound[name]) return FairySound[name](a, b, c); }catch(e){} };

  // 画像を先に読み込んで、切り替えでチラつかないようにする
  const frameUrl = n => n + '.webp';
  const _load = n => { const i = new Image(); i.src = frameUrl(n); };
  [ROSE.frames.rest, ROSE.frames.blink].forEach(_load);                  // まず、ふだんの2まい
  setTimeout(() => { const go = () => ROSE.frames.jump.forEach(p => _load(p[0]));          // ジャンプ用は、あとからゆっくり
    if(window.requestIdleCallback) requestIdleCallback(go, {timeout:2000}); else go(); }, 1500);

  const S = { shown:false, enterT:1, enterAt:0, jumping:false, jumpStart:0, lastTrail:0 };
  const JUMP_MS = 3400, ENTER_MS = 1300;

  const ease = {
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inQuad:   t => t * t,
    outBack:  t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); }
  };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ============================================================
  // 毎フレーム：ローズの位置・大きさ（飛び出す／ジャンプ）
  // ============================================================
  let lastT = performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    const dt = Math.min(64, now - lastT); lastT = now;
    if(!S.shown) return;
    const W = window.innerWidth, H = window.innerHeight;

    // 大きさ：画面の高さの約4割（横にはみ出さない）。位置：画面のまんなか
    const baseH = Math.min(H * 0.42, (W * 0.98) / META.aspect), baseW = baseH * META.aspect;
    const tx = W / 2, ty = H * 0.48;
    let px = tx, py = ty, sc = 1, sx = 1, sy = 1, rot = 0;

    // --- 飛び出す！ 画面の下から ぐーんと飛び出して、ぽよんと着地 ---
    if(S.enterT < 1){
      S.enterT = Math.min(1, S.enterT + dt / ENTER_MS);
      const t = S.enterT;
      py = ty + (1 - ease.outCubic(t)) * (H * 0.65);
      px = tx + Math.sin(t * Math.PI * 2) * W * 0.07 * (1 - t);
      sc = 0.12 + 0.88 * Math.max(0, ease.outBack(t));
      rot = Math.sin(t * Math.PI * 3) * 9 * (1 - t);
      if(now - S.lastTrail > 45){ S.lastTrail = now; for(let i=0;i<2;i++){ const p = bodyPoint(); FairyFX.spark(fx, p.x, p.y, fxo(1.3)); } }   // 飛びながらキラキラ
    }

    // --- ジャンプ：画面の中央めがけて大きく跳ぶ ---
    if(S.jumping){
      const p = (now - S.jumpStart) / JUMP_MS;
      if(p >= 1){ S.jumping = false; img.src = frameUrl(ROSE.frames.rest); }
      else {
        let r = 0;
        if(p > .19 && p < .47)      r = ease.outCubic((p - .19) / .28);
        else if(p >= .47 && p < .57) r = 1;
        else if(p >= .57 && p < .72) r = 1 - ease.inQuad((p - .57) / .15);
        const Smax = Math.min(2.6, (H * 0.80) / baseH, (W * 1.08) / (META.bodyW * baseW));
        const S_up = Math.max(1.2, Smax);
        sc *= 1 + (S_up - 1) * r;
        py = py + (H * 0.44 - py) * r - Math.sin(Math.PI * r) * H * 0.04;
        rot = 5 * Math.sin(p * Math.PI * 3) * r;
        if(p >= .08 && p < .19){ const q = Math.sin(Math.PI * (p - .08) / .11); sy *= 1 - .10 * q; sx *= 1 + .06 * q; }
        if(p >= .70 && p < .82){ const q = Math.sin(Math.PI * (p - .70) / .12); sy *= 1 - .11 * q; sx *= 1 + .08 * q; }
      }
    }

    box.style.width  = baseW.toFixed(1) + 'px';
    box.style.height = baseH.toFixed(1) + 'px';
    box.style.transform =
      `translate3d(${(px - baseW/2).toFixed(1)}px, ${(py - baseH/2).toFixed(1)}px, 0) ` +
      `rotate(${rot.toFixed(2)}deg) scale(${(sc*sx).toFixed(3)}, ${(sc*sy).toFixed(3)})`;
  }
  requestAnimationFrame(frame);

  // ============================================================
  // キラキラ（ふだん＆ジャンプ中）
  // ============================================================
  const fxo = (power) => ({ colors:ROSE.sparks, glyphs:ROSE.glyphs, size:17, power:power||1, dur:1500 });
  function bodyPoint(){
    const r = box.getBoundingClientRect();
    return { x: r.left + r.width*(META.cx + (Math.random()-.5)*META.bodyW*1.25),
             y: r.top  + r.height*(0.06 + Math.random()*0.88) };
  }
  (function idleSparkles(){
    if(S.shown && !S.jumping && S.enterT >= 1){
      const p = bodyPoint(); FairyFX.spark(fx, p.x, p.y, fxo(0.9));
      if(Math.random() < .5){ const q = bodyPoint(); FairyFX.spark(fx, q.x, q.y, fxo(0.9)); }
    }
    setTimeout(idleSparkles, 380 + Math.random()*420);
  })();

  // まばたき
  function blinkOnce(){
    if(S.jumping) return;
    img.src = frameUrl(ROSE.frames.blink);
    setTimeout(()=>{ if(!S.jumping) img.src = frameUrl(ROSE.frames.rest); }, 150);
  }
  (function scheduleBlink(){
    setTimeout(()=>{ if(S.shown){ blinkOnce(); if(Math.random() < .3) setTimeout(blinkOnce, 340); } scheduleBlink(); }, 2200 + Math.random()*2600);
  })();

  // ============================================================
  // タップでジャンプ（画面のどこをタップしてもOK）
  // ============================================================
  function onJump(){
    if(!S.shown || S.jumping || S.enterT < 1) return;
    S.jumping = true; S.jumpStart = performance.now();
    snd('jump'); setTimeout(()=>snd('land'), JUMP_MS * 0.72);
    let acc = 0;
    ROSE.frames.jump.forEach(([fr, frac]) => {
      setTimeout(()=>{ if(S.jumping) img.src = frameUrl(fr); }, acc * JUMP_MS);
      acc += frac;
    });
    setTimeout(()=>{ const p = bodyPoint(); FairyFX.burst(fx, p.x, p.y, 22, fxo(1.8)); }, JUMP_MS * .18);
    const trail = setInterval(()=>{ for(let i=0;i<3;i++){ const p = bodyPoint(); FairyFX.spark(fx, p.x, p.y, fxo(1.5)); } }, 55);
    setTimeout(()=>clearInterval(trail), JUMP_MS * .74);
    setTimeout(()=>{ const p = bodyPoint(); FairyFX.burst(fx, p.x, p.y, 34, fxo(2.4)); }, JUMP_MS * .70);
  }
  document.addEventListener('pointerdown', e => {
    if(e.target.closest && e.target.closest('.home-btn, .start-veil, #sndToggle')) return;
    onJump();
  });

  // ============================================================
  // ふきだし
  // ============================================================
  const voices = [
    'はじめまして！バラの妖精ローズよ 🌹',
    'タップして私のジャンプを見てね ✨',
    'いい香りと一緒にあそぼ〜 💕',
    'ローズの香りで満たすわ 🌹',
    'また会いに来てね ♪'
  ];
  function say(txt){ bubble.textContent = txt; bubble.classList.add('show'); setTimeout(()=>bubble.classList.remove('show'), 3500); }
  function startBubbles(){
    let i = 1;
    setTimeout(()=>say(voices[0]), 1500);
    setInterval(()=>{ say(voices[i % voices.length]); i++; }, 5500);
  }
  function showNote(t, ms){ note.textContent = t; note.classList.add('show'); setTimeout(()=>note.classList.remove('show'), ms || 3600); }

  // ============================================================
  // ローズが飛び出す！
  // ============================================================
  function showRose(){
    if(S.shown) return;
    try{ FairyStore.mark(ROSE); }catch(e){}                                  // 「見つけた」を記録
    S.shown = true; S.enterT = 0; S.enterAt = performance.now();
    box.classList.add('on');
    snd('jump');                                                              // ぴゅーん！
    setTimeout(()=>snd('register'), 850);                                    // 着地：キラキラ音
    setTimeout(()=>snd('say', 'voice_rose_hello', 'はじめまして！ローズよ。よろしくね！', 'rose'), 1500);   // かわいい声で「はじめまして」
    setTimeout(()=>{ const p = bodyPoint(); FairyFX.burst(fx, p.x, p.y, 34, fxo(2.2)); }, 900);
    setTimeout(()=>{ hint.textContent = '💡 ローズをタップすると、画面いっぱいにジャンプするよ 🌹'; zukanBtn.classList.add('show'); homeBtn.classList.add('show'); }, 1900);
    startBubbles();
  }

  // ============================================================
  // カメラ（なくても遊べる。使えない時は、ピンクの背景のまま）
  // ============================================================
  async function startCamera(){
    try{
      if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
      const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
      cam.srcObject = stream; await cam.play(); cam.classList.add('on');
    }catch(e){
      showNote('カメラが使えなかったので、ピンクの背景であそぶよ 🌸', 4200);
    }
  }

  startBtn.addEventListener('click', () => {
    snd('unlock');                                // iPhone は、タップの時に音を有効にする
    startVeil.classList.add('hide');
    setTimeout(() => startVeil.style.display = 'none', 450);
    showRose();                                   // 待たずに、すぐ飛び出す
    startCamera();                                // カメラは、あとから（ゆるしてもらえたら）うしろに出る
  });

  // ?dev=1 … 動きの確認用（「ローズに会う」を自動で押す）
  if(new URLSearchParams(location.search).get('dev') === '1') setTimeout(() => startBtn.click(), 300);

})();
</script>
