<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebAR Fairy World ― 妖精たちのファンタジーの旅</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { fairyPink:'#ffb7c5', fairyGold:'#f3e5ab', fairyGoldDeep:'#d4af37',
                  fairyCream:'#fffbf5', fairyLavender:'#e6e6fa', fairyRose:'#ff9ebb', fairyMint:'#d1f8ef' },
        fontFamily: { rounded:['"M PLUS Rounded 1c"','sans-serif'],
                       fairy:['"Cinzel Decorative"','serif'],
                       script:['"Great Vibes"','cursive'] }
      }
    }
  }
</script>
<style>
  body{font-family:'M PLUS Rounded 1c',sans-serif;
       background:linear-gradient(135deg,#fff0f5 0%,#fffbf5 50%,#f0f8ff 100%);
       color:#4a3b32;overflow-x:hidden;user-select:none}
  .glass-card{background:rgba(255,255,255,.75);backdrop-filter:blur(16px);
              -webkit-backdrop-filter:blur(16px);
              border:1px solid rgba(255,228,235,.8);
              box-shadow:0 10px 30px rgba(255,182,193,.18)}
  .gold-text{background:linear-gradient(135deg,#d4af37,#f3e5ab,#d4af37);
             -webkit-background-clip:text;background-clip:text;color:transparent}
  #three-bg{position:fixed;inset:0;z-index:-1;opacity:.6}

  /* ★ ハブ用のステージナビ（追加） */
  .hub-stage-link{padding:14px 18px;border-radius:18px;
                  display:flex;align-items:center;gap:12px;cursor:pointer;
                  transition:transform .15s,box-shadow .15s}
  .hub-stage-link:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.08)}

  /* ★ ハブ側で妖精ミニカードも出す */
  .hub-mini-fairy{position:relative;border-radius:20px;overflow:hidden;
                  background:rgba(255,255,255,.85);border:2px solid var(--fc,#ff4081);
                  padding:12px;display:flex;flex-direction:column;align-items:center}
  .hub-media{position:relative;display:flex;align-items:center;justify-content:center;height:170px}
  .hub-mini-fairy img{height:170px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.15));-webkit-user-drag:none}
  .hub-mini-fairy.locked img{filter:brightness(0) opacity(.22) blur(1px)}
  .hub-mini-fairy .q-mark{position:absolute;font-size:56px;font-weight:700;color:var(--fc,#ff4081);opacity:.75;animation:qPulse 2.2s ease-in-out infinite}
  @keyframes qPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.15);opacity:.9}}
  .hub-mini-fairy.just-found{animation:justFound 1.4s ease-out 1}
  @keyframes justFound{0%{transform:scale(.92)}35%{transform:scale(1.06);box-shadow:0 0 0 12px rgba(255,213,79,.45)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,213,79,0)}}
  .hub-mini-fairy .ph-circle{width:160px;height:160px;border-radius:50%;
       background:radial-gradient(circle,color-mix(in srgb,var(--fc,#ff4081) 30%,#fff) 0%,transparent 70%);
       border:3px dashed var(--fc,#ff4081);display:flex;align-items:center;justify-content:center;
       font-size:60px;color:var(--fc,#ff4081)}
</style>
</head>
<body>
<div id="three-bg"></div>

<nav class="w-full glass-card sticky top-0 z-30 px-4 sm:px-6 py-3 flex items-center justify-between border-b border-pink-100/50">
  <div class="flex items-center space-x-2">
    <span class="text-2xl">🧚‍♀️</span>
    <h1 class="font-fairy text-lg sm:text-xl font-bold gold-text">WebAR Fairy World</h1>
  </div>
  <div class="px-3 py-1.5 rounded-full bg-gradient-to-r from-pink-500 to-amber-500 text-white text-xs sm:text-sm font-bold shadow">
    ✨ 発見 <span id="navCount">0</span> / 4
  </div>
</nav>

<main class="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 pt-6 pb-12 flex flex-col gap-8">

  <section id="view-home" class="w-full flex flex-col items-center py-4">
    <div class="text-center mb-5">
      <span class="text-xs font-bold tracking-widest text-pink-500 uppercase px-3 py-1 rounded-full bg-pink-100">Home</span>
      <h2 class="font-fairy text-3xl sm:text-4xl font-bold gold-text mt-2">妖精たちの世界へようこそ</h2>
      <p class="text-sm text-pink-900/80 mt-2 leading-relaxed" id="lead"></p>
    </div>

    <!-- 発見のメーター -->
    <div class="w-full max-w-md mb-6">
      <div class="flex justify-between text-xs font-bold text-pink-700 mb-1"><span>みつけた妖精</span><span><span id="barCount">0</span> / 4</span></div>
      <div class="h-3 rounded-full bg-pink-100 overflow-hidden"><div id="barFill" class="h-full rounded-full bg-gradient-to-r from-pink-400 to-amber-400" style="width:0%;transition:width .8s"></div></div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 w-full" id="hubFairyGrid"></div>

    <!-- フィナーレ（4人みつけたら開く） -->
    <div id="finale" class="w-full max-w-md mt-8 glass-card rounded-3xl p-5 text-center"></div>
  </section>
</main>

<footer class="w-full py-4 text-center z-10 glass-card text-xs text-pink-800/70 border-t border-pink-100/50 mt-auto">
  <p>WebAR Fairy World &copy; 2026 | Fantasy Fairytale Aesthetic Experience</p>
  <p class="mt-1"><a href="#" id="resetLink" class="underline opacity-70">🔄 はじめからやりなおす</a></p>
</footer>

<!-- ★ この HTML は単独でも動くが、妖精を発見したらカードに「発見」バッジを立てる -->
<script src="fairies.js"></script>
<script>
  /* ===== ホーム：4人のカード（見つけた人だけ姿が見える） ===== */
  const found = FairyStore.get();
  const total = FAIRIES.length;
  const foundCount = FAIRIES.filter(f => found[f.id]).length;
  const roseFound = !!found.rose;

  document.getElementById('navCount').textContent = foundCount;
  document.getElementById('barCount').textContent = foundCount;
  document.getElementById('barFill').style.width = '0%';
  setTimeout(()=>{ document.getElementById('barFill').style.width = (foundCount/total*100) + '%'; }, 120);
  document.getElementById('lead').innerHTML = (foundCount >= total)
    ? '4人の妖精ぜんいんに会えたね！ 🌟<br>下のボタンから、みんなでフィナーレへ行こう。'
    : roseFound
      ? 'ローズに会えたね！ 🌹<br>カメラをかざして、かくれている3人の妖精をさがしにいこう。'
      : 'まずは、ローズの絵（マーカー）にカメラを向けて、ローズに会いにいこう。';

  const newId = new URLSearchParams(location.search).get('new');
  const wrap = document.getElementById('hubFairyGrid');

  FAIRIES.forEach(f => {
    const isFound = !!found[f.id];
    const card = document.createElement('div');
    card.className = 'hub-mini-fairy' + (isFound ? '' : ' locked') + (newId === f.id ? ' just-found' : '');
    card.style.setProperty('--fc', f.color);
    card.dataset.id = f.id;

    const media = document.createElement('div');
    media.className = 'hub-media';
    const img = document.createElement('img');
    img.alt = isFound ? f.name : '？？？';
    img.src = (f.frames.rest.endsWith('.png') ? f.frames.rest : f.frames.rest + '.png');
    img.draggable = false;
    media.appendChild(img);
    if(!isFound){
      const q = document.createElement('div'); q.className = 'q-mark'; q.textContent = '？'; media.appendChild(q);
    }
    card.appendChild(media);

    if(isFound){
      const badge = document.createElement('div');
      badge.className = 'absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700';
      badge.textContent = '発見済み ✓';
      card.appendChild(badge);
    }

    const name = document.createElement('div');
    name.className = 'mt-2 font-bold text-base text-gray-800';
    name.textContent = isFound ? f.name : '？？？';
    card.appendChild(name);

    const role = document.createElement('div');
    role.className = 'text-xs font-semibold text-center';
    role.style.color = isFound ? f.accent : '#8a7a85';
    role.textContent = isFound ? f.role : 'ひみつの妖精';
    card.appendChild(role);

    const memo = document.createElement('div');
    memo.className = 'text-[11px] text-gray-500 text-center mt-1 leading-snug';
    memo.style.minHeight = '2.6em';
    memo.textContent = isFound ? (f.captions ? f.captions[0] : '') : (f.hint || '');
    card.appendChild(memo);

    const btn = document.createElement('button');
    btn.className = 'mt-3 px-4 py-2 rounded-full text-white font-bold text-sm shadow';
    btn.style.background = f.accent;
    if(f.id === 'rose'){
      btn.textContent = isFound ? '🌹 もう一度会う' : '📷 マーカーで会いにいく';
      btn.onclick = () => { location.href = 'index.html'; };
    } else {
      btn.textContent = isFound ? '🔍 もう一度さがす' : '🔍 さがしにいく';
      btn.onclick = () => { location.href = 'find.html?f=' + encodeURIComponent(f.id); };
    }
    card.appendChild(btn);
    wrap.appendChild(card);
  });

  /* ===== フィナーレ ===== */
  (function(){
    const box = document.getElementById('finale');
    if(foundCount >= total){
      box.innerHTML = '<div class="text-3xl">🎉</div>'+
        '<div class="font-bold text-pink-700 mt-1">4人ぜんいん見つけたよ！ ありがとう</div>'+
        '<button class="mt-3 px-5 py-2.5 rounded-full text-white font-bold shadow bg-gradient-to-r from-pink-500 to-amber-500" onclick="location.href=\'index4.html\'">🌟 みんなでフィナーレへ</button>';
    } else {
      box.innerHTML = '<div class="text-2xl opacity-60">🔒</div>'+
        '<div class="text-sm font-bold text-gray-500 mt-1">4人みつけると、フィナーレが開くよ</div>'+
        '<div class="text-xs text-gray-400 mt-1">あと ' + (total - foundCount) + ' 人</div>';
    }
  })();

  /* ===== 見つけて戻ってきたとき：キラキラでお祝い ===== */
  if(newId){
    const target = wrap.querySelector('[data-id="'+newId+'"]');
    if(target){
      setTimeout(()=>{
        const layer = FairyFX.createLayer(document.body, true);
        const f = FAIRIES.find(x => x.id === newId);
        const r = target.getBoundingClientRect();
        FairyFX.burst(layer, r.left + r.width/2, r.top + r.height*0.35, 34, { colors:f.sparks, glyphs:f.glyphs, size:20, power:2.2, dur:1700 });
        target.scrollIntoView({ behavior:'smooth', block:'center' });
      }, 500);
    }
  }

  /* ===== やりなおし ===== */
  document.getElementById('resetLink').addEventListener('click', e => {
    e.preventDefault();
    if(confirm('みつけた妖精の記録を消して、はじめからやりなおしますか？')){ FairyStore.reset(); location.href = 'webar_fairy_world.html'; }
  });

  /* ===== Three.js 背景 ===== */
  function initThreeBg(){
    const c = document.getElementById('three-bg');
    if (!c) return;
    try{
      const r = new THREE.WebGLRenderer({ alpha:true });
      r.setSize(window.innerWidth, window.innerHeight);
      c.appendChild(r.domElement);
      const scene = new THREE.Scene();
      const cam = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
      cam.position.z = 5;
      const g = new THREE.BufferGeometry();
      const v = []; for (let i=0;i<300;i++) v.push((Math.random()-.5)*20, (Math.random()-.5)*20, (Math.random()-.5)*20);
      g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
      const m = new THREE.PointsMaterial({ color:0xffd700, size:0.06, transparent:true, opacity:0.7 });
      const ps = new THREE.Points(g, m);
      scene.add(ps);
      (function tick(){ ps.rotation.y += 0.0008; r.render(scene, cam); requestAnimationFrame(tick); })();
    }catch(e){}
  }
  window.addEventListener('DOMContentLoaded', initThreeBg);
</script>

<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"4edd5f8ec12a48cfa682ab8261b80a79","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
